version: v2beta1

vars:
  FILES_NAMESPACE: platform
  E2E_IMAGE: ghcr.io/agynio/devcontainer-go:1

functions:
  disable_argocd_sync: |-
    if kubectl get application files -n argocd >/dev/null 2>&1; then
      echo "Disabling ArgoCD auto-sync for files..."
      kubectl patch application files -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":null}}}'
      echo "ArgoCD auto-sync disabled."
    else
      echo "WARNING: ArgoCD Application 'files' not found in argocd namespace."
    fi
  restore_argocd_sync: &restore_argocd_sync |-
    if kubectl get application files -n argocd >/dev/null 2>&1; then
      echo "Re-enabling ArgoCD auto-sync for files..."
      kubectl patch application files -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'
      echo "ArgoCD auto-sync restored."
    else
      echo "WARNING: ArgoCD Application 'files' not found in argocd namespace."
    fi
  patch_deployment: |-
    echo "Patching files deployment for DevSpace..."
    kubectl patch deployment files -n ${FILES_NAMESPACE} --type strategic --patch "$(cat <<'EOF'
    spec:
      template:
        spec:
          securityContext:
            runAsUser: 1000
            fsGroup: 1000
          initContainers: []
          volumes:
            - name: data
              emptyDir: {}
          containers:
            - name: files
              image: ghcr.io/agynio/devcontainer-go:1 # keep in sync with E2E_IMAGE
              workingDir: /opt/app/data
              command:
                - sh
                - -c
                - |
                  set -eu
                  elapsed=0
                  while [ ! -f /opt/app/data/go.mod ]; do
                    sleep 1; elapsed=$((elapsed + 1))
                    [ "$elapsed" -ge 120 ] && { echo "ERROR: sync timeout" >&2; exit 1; }
                  done
                  buf generate buf.build/agynio/api --path agynio/api/files/v1
                  exec go run ./cmd/files
              volumeMounts:
                - name: data
                  mountPath: /opt/app/data
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                readOnlyRootFilesystem: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
    EOF
    )"

deployments:
  e2e-runner:
    namespace: ${FILES_NAMESPACE}
    helm:
      chart:
        name: component-chart
        repo: https://charts.devspace.sh
      values:
        containers:
          - image: ${E2E_IMAGE}
            command: ["sleep", "infinity"]
            env:
              - name: FILES_ADDRESS
                value: "files:50051"
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 2Gi
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              readOnlyRootFilesystem: false
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
        securityContext:
          runAsUser: 1000
          fsGroup: 1000
        labels:
          app.kubernetes.io/name: files-e2e

commands:
  test-e2e: |-
    devspace run-pipeline test-e2e $@

pipelines:
  dev:
    flags:
      - name: watch
        short: w
        description: "Keep DevSpace running and stream logs"
    run: |-
      disable_argocd_sync
      patch_deployment
      if [ "$(get_flag "watch")" == "true" ]; then
        start_dev --disable-pod-replace files
      else
        start_dev --disable-pod-replace files
        echo "Waiting for files to be healthy on :50051..."
        healthy=false
        for i in $(seq 1 60); do
          if exec_container --label-selector=app.kubernetes.io/name=files -n ${FILES_NAMESPACE} -- bash -c 'nc -z localhost 50051 >/dev/null 2>&1 || (echo > /dev/tcp/localhost/50051) >/dev/null 2>&1'; then
            healthy=true
            break
          fi
          sleep 2
        done
        if [ "$healthy" != "true" ]; then
          echo "ERROR: Files did not become healthy within 120s" >&2
          exit 1
        fi
        echo "Dev environment ready. Stopping dev session."
        stop_dev files
      fi

  test-e2e:
    run: |-
      create_deployments e2e-runner
      trap 'stop_dev e2e-runner; purge_deployments e2e-runner' EXIT
      start_dev e2e-runner --disable-pod-replace
      echo "Waiting for source files to sync..."
      sleep 5
      echo "Generating protobuf types..."
      exec_container --label-selector=app.kubernetes.io/name=devspace-app,app.kubernetes.io/component=e2e-runner -n ${FILES_NAMESPACE} -- \
        bash -c 'cd /opt/app/data && buf generate buf.build/agynio/api --path agynio/api/files/v1'
      echo "Running e2e tests..."
      exec_container --label-selector=app.kubernetes.io/name=devspace-app,app.kubernetes.io/component=e2e-runner -n ${FILES_NAMESPACE} -- \
        bash -c 'cd /opt/app/data && go test -v -count=1 -tags e2e ./test/e2e/'
      echo "Cleaning up test runner pod..."
      stop_dev e2e-runner
      purge_deployments e2e-runner
      trap - EXIT

hooks:
  - name: restore-argocd-auto-sync
    events:
      - after:dev:files
    command: bash
    args:
      - -c
      - *restore_argocd_sync

dev:
  files:
    namespace: ${FILES_NAMESPACE}
    labelSelector:
      app.kubernetes.io/name: files
      app.kubernetes.io/instance: files
    containers:
      files:
        container: files
        sync:
          - path: ./:/opt/app/data
            excludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
            uploadExcludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
            downloadExcludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
        logs:
          enabled: true
          lastLines: 200
    ports:
      - port: "50051"

  e2e-runner:
    namespace: ${FILES_NAMESPACE}
    labelSelector:
      app.kubernetes.io/name: devspace-app
      app.kubernetes.io/component: e2e-runner
    sync:
      - path: ./:/opt/app/data
        noWatch: true
        excludePaths:
          - .git/
          - /.gen/
          - .devspace/
        uploadExcludePaths:
          - .git/
          - /.gen/
        downloadExcludePaths:
          - .git/
          - /.gen/
