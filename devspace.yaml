version: v2beta1

vars:
  FILES_NAMESPACE: platform

functions:
  disable_argocd_sync: |-
    if kubectl get application files -n argocd >/dev/null 2>&1; then
      echo "Disabling ArgoCD auto-sync for files..."
      kubectl patch application files -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":null}}}'
      echo "ArgoCD auto-sync disabled."
    else
      echo "WARNING: ArgoCD Application 'files' not found in argocd namespace."
    fi
  restore_argocd_sync: &restore_argocd_sync |-
    if [ -n "${CI:-}" ]; then
      echo "Skipping ArgoCD auto-sync restore in CI."
      exit 0
    fi
    if kubectl get application files -n argocd >/dev/null 2>&1; then
      echo "Re-enabling ArgoCD auto-sync for files..."
      kubectl patch application files -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'
      echo "ArgoCD auto-sync restored."
    else
      echo "WARNING: ArgoCD Application 'files' not found in argocd namespace."
    fi
  patch_deployment: |-
    echo "Patching files deployment for DevSpace..."
    kubectl patch deployment files -n ${FILES_NAMESPACE} --type strategic --patch "$(cat <<'EOF'
    spec:
      template:
        spec:
          securityContext:
            runAsUser: 1000
            fsGroup: 1000
          initContainers: []
          volumes:
            - name: data
              emptyDir: {}
          containers:
            - name: files
              image: ghcr.io/agynio/devcontainer-go:1
              workingDir: /opt/app/data
              command:
                - sh
                - -c
                - |
                  set -eux
                  elapsed=0
                  while [ ! -f /opt/app/data/go.mod ] || [ ! -f /opt/app/data/go.sum ] || [ ! -f /opt/app/data/buf.gen.yaml ] || [ ! -f /opt/app/data/cmd/files/main.go ]; do
                    sleep 1; elapsed=$((elapsed + 1))
                    [ "$elapsed" -ge 300 ] && { echo "ERROR: sync timeout" >&2; exit 1; }
                  done
                  echo "Files synced, generating protobuf types..."
                  buf generate buf.build/agynio/api --path agynio/api/files/v1
                  echo "buf generate complete, starting files..."
                  export GOTOOLCHAIN=local
                  exec go run ./cmd/files
              volumeMounts:
                - name: data
                  mountPath: /opt/app/data
              livenessProbe: null
              readinessProbe: null
              startupProbe: null
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                readOnlyRootFilesystem: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
    EOF
    )"

pipelines:
  dev:
    flags:
      - name: watch
        short: w
        description: "Keep DevSpace running and stream logs"
    run: |-
      disable_argocd_sync
      patch_deployment
      if [ "$(get_flag "watch")" == "true" ]; then
        start_dev --disable-pod-replace files
      else
        start_dev --disable-pod-replace files
        echo "Waiting for files to be healthy on :50051..."
        healthy=false
        for i in $(seq 1 60); do
          if exec_container --label-selector=app.kubernetes.io/name=files -n ${FILES_NAMESPACE} -- bash -c 'nc -z localhost 50051 >/dev/null 2>&1 || (echo > /dev/tcp/localhost/50051) >/dev/null 2>&1'; then
            healthy=true
            break
          fi
          sleep 2
        done
        if [ "$healthy" != "true" ]; then
          echo "ERROR: Files did not become healthy within 120s" >&2
          exit 1
        fi
        echo "Dev environment ready. Stopping dev session."
        stop_dev files
      fi

hooks:
  - name: restore-argocd-auto-sync
    events:
      - after:dev:files
    command: bash
    args:
      - -c
      - *restore_argocd_sync

dev:
  files:
    namespace: ${FILES_NAMESPACE}
    labelSelector:
      app.kubernetes.io/name: files
      app.kubernetes.io/instance: files
    containers:
      files:
        container: files
        sync:
          - path: ./:/opt/app/data
            excludePaths:
              - .git/
              - .devspace/
              - .terraform/
              - /.gen/
              - /bootstrap/
              - /dist/
              - /e2e/
              - /tmp/
              - terraform.tfstate*
            uploadExcludePaths:
              - .git/
              - .devspace/
              - .terraform/
              - /.gen/
              - /bootstrap/
              - /dist/
              - /e2e/
              - /tmp/
              - terraform.tfstate*
            downloadExcludePaths:
              - .git/
              - .devspace/
              - .terraform/
              - /.gen/
              - /bootstrap/
              - /dist/
              - /e2e/
              - /tmp/
              - terraform.tfstate*
        logs:
          enabled: true
          lastLines: 200
    ports:
      - port: "50051"
