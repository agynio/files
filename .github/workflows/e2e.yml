name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision cluster
        uses: agynio/e2e/.github/actions/provision-vm@main

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@main

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: 1.66.0

      - name: Deploy files from source
        run: |
          buf generate buf.build/agynio/api --path agynio/api/files/v1
          devspace dev

      - name: Checkout E2E repository
        uses: actions/checkout@v4
        with:
          repository: agynio/e2e
          ref: main
          path: e2e

      - name: Patch E2E suite execution
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          // This job checks e2e out itself and patches the suites below, so the
          // action must not check it out again on top of them. Matched by step
          // name rather than by its exact text: pinning the whole block meant
          // any edit to the action -- an added input, a changed ref expression
          // -- broke this job instead of the action.
          const actionPath = 'e2e/.github/actions/run-tests/action.yml';
          let action = fs.readFileSync(actionPath, 'utf8');
          const checkoutStep = /^ {4}- name: Checkout e2e repository\n(?: {5,}.*\n|\n)*?(?=^ {4}- name: )/m;
          if (!checkoutStep.test(action)) {
            throw new Error('expected a "Checkout e2e repository" step in the e2e run-tests action');
          }
          action = action.replace(checkoutStep, '');
          fs.writeFileSync(actionPath, action);

          for (const suite of ['playwright-chat-app', 'playwright-tracing-app', 'playwright']) {
            const suitePath = `e2e/suites/${suite}/suite.yaml`;
            let content = fs.readFileSync(suitePath, 'utf8');
            const generate = '  npx buf generate\n';
            const directGenerate = [
              '  npm ci --no-fund --no-audit',
              '  node <<\'NODE\'',
              '  const fs = require("fs");',
              '  const os = require("os");',
              '  const path = require("path");',
              '  const packages = {',
              '    "linux x64 LE": "@bufbuild/buf-linux-x64",',
              '    "linux arm64 LE": "@bufbuild/buf-linux-aarch64",',
              '    "linux armv7 LE": "@bufbuild/buf-linux-armv7",',
              '    "darwin x64 LE": "@bufbuild/buf-darwin-x64",',
              '    "darwin arm64 LE": "@bufbuild/buf-darwin-arm64",',
              '    "win32 x64 LE": "@bufbuild/buf-win32-x64",',
              '    "win32 arm64 LE": "@bufbuild/buf-win32-arm64"',
              '  };',
              '  const key = `${process.platform} ${os.arch()} ${os.endianness()}`;',
              '  const pkg = packages[key];',
              '  if (!pkg) {',
              '    throw new Error(`Unsupported buf platform: ${key}`);',
              '  }',
              '  const binary = process.platform === "win32" ? "buf.exe" : "buf";',
              '  const source = require.resolve(`${pkg}/bin/${binary}`);',
              '  const target = path.join(os.tmpdir(), `agynio-e2e-buf-${process.pid}`);',
              '  fs.copyFileSync(source, target);',
              '  fs.chmodSync(target, 0o755);',
              '  fs.writeFileSync(".buf-bin", target);',
              '  NODE',
              '  PATH="./node_modules/.bin:$PATH" "$(cat .buf-bin)" generate',
            ].join('\n') + '\n';
            if (!content.includes(generate)) {
              throw new Error(`expected buf generate command not found in ${suitePath}`);
            }
            content = content.replace(generate, directGenerate);
            fs.writeFileSync(suitePath, content);
          }
          NODE

      - name: Run E2E tests
        uses: ./e2e/.github/actions/run-tests
        with:
          service: files
